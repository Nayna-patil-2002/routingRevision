<h4>{{isInEdit?'updateUser':"adduser"}}</h4>


<div class="conatiner" [formGroup]="userForm" (ngSubmit)="onAdduser()">
    <div class="row">
        <div class="col-8 offset-2">
           <div class="card">
            <div class="card-body">
                <form>
                    <div class="form-group">
                       <label for="name">Name</label>
                       <input id="name" formControlName="name" class="form-control" type="text">
                    </div>
                    <div class="form-group">
                      <label for="email">Email</label>
                      <input id="email" formControlName="email" class="form-control" type="text">
                    </div>
                    <div class="form-group">
                     <label for="age">Age</label>
                     <input id="age" formControlName="age" class="form-control" type="text">
                    </div>
                    <div class="form-group">
                        <label for="img">Image</label>
                        <input id="img" type="text" class="form-control" formControlName="image">
                    </div>
                    <button class="btn btn-sm btn-primary" type="button" *ngIf="isInEdit" (click)="onUpdate()">Update User</button>
                    <button class="btn btn-sm btn-primary" *ngIf="!isInEdit"  >Add User</button>
                </form>
            </div>
           </div>
        </div>
    </div>
</div>
